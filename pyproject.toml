# Tool settings only: the integration itself is installed by HACS from
# custom_components/, not as a Python package.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/sonnen_battery"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
    "RUF012", # `_attr_x = [...]` class attributes are the standard HA pattern
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
