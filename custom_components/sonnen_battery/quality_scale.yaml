# Self-assessment against Home Assistant's Integration Quality Scale:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# hassfest only enforces this file for core integrations; here it's a checklist.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >-
      10 s default, so the energy counters integrate accurately. Unlike core
      integrations, the interval is a user option (5-300 s).
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No requirements; the API client is part of the integration.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: No device conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No device triggers.
  entity-event-setup:
    status: exempt
    comment: Entities don't subscribe to events; all data comes from the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Handled by the DataUpdateCoordinator (logs once when lost and once when back).
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: >-
      No local discovery protocol is known for the battery yet. Needs checking
      on a real system (mDNS, SSDP or DHCP hostname).
  discovery-update-info:
    status: todo
    comment: Depends on discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: done
    comment: Documented by API version; no model has been confirmed by users yet.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device per config entry; there are no sub-devices to add later.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >-
      The only user-fixable problem, a rejected token, is handled by the
      re-authentication flow.
  stale-devices:
    status: exempt
    comment: One device per config entry; it is removed with the entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
